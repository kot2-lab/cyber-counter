<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ultimate Cyber Counter</title>

<style>

:root{
    --bg-color:#000;
    --accent-color:#39ff14;
    --reset-color:#ff3333;
    --dial-bg:#111;
}

/* =========================
   BODY
========================= */

body{
    margin:0;
    background:var(--bg-color);
    color:white;
    font-family:'Meiryo',sans-serif;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    height:100vh;

    overflow:hidden;
}

/* =========================
   MODES
========================= */

body.matrix{
    background:
        repeating-linear-gradient(
            0deg,
            #001100,
            #001100 2px,
            #000 2px,
            #000 4px
        );
}

body.rgb{
    animation:rgbbg 6s linear infinite;
}

@keyframes rgbbg{
    0%{
        filter:hue-rotate(0deg);
    }

    100%{
        filter:hue-rotate(360deg);
    }
}

body.crt::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            rgba(255,255,255,0.03) 50%,
            transparent 50%
        );

    background-size:100% 4px;

    z-index:9999;
}

/* =========================
   FPS
========================= */

#fpsCounter{

    position:absolute;

    top:20px;
    left:30px;

    color:var(--accent-color);

    font-weight:900;
    font-size:1.2rem;
}

/* =========================
   AUTO STATUS
========================= */

#autoStatus{

    position:absolute;

    left:30px;
    top:60px;

    background:rgba(0,0,0,0.75);

    color:var(--accent-color);

    border:2px solid var(--accent-color);
    border-radius:20px;

    padding:15px 20px;

    font-size:1.1rem;
    font-weight:900;

    display:none;

    z-index:999;

    box-shadow:
        0 0 20px rgba(57,255,20,0.4);
}

/* =========================
   COMMAND PANEL
========================= */

#commandPanel{

    position:absolute;

    left:30px;
    top:150px;

    width:340px;

    background:rgba(0,0,0,0.82);

    border:2px solid var(--accent-color);
    border-radius:20px;

    padding:20px;

    color:var(--accent-color);

    font-weight:900;

    opacity:0;

    pointer-events:auto;

    transform:translateY(-10px);

    transition:0.25s;

    box-shadow:
        0 0 25px rgba(57,255,20,0.25);

    max-height:70vh;

    overflow-y:auto;

    overscroll-behavior:contain;

    backdrop-filter:blur(8px);

    z-index:999;
}

#commandPanel.show{

    opacity:1;

    transform:translateY(0);
}

#commandPanel::-webkit-scrollbar{

    width:10px;
}

#commandPanel::-webkit-scrollbar-thumb{

    background:var(--accent-color);

    border-radius:20px;

    box-shadow:
        0 0 10px var(--accent-color);
}

.command-title{

    font-size:1.5rem;

    margin-bottom:15px;
}

.command-item{

    margin-bottom:15px;

    line-height:1.5;
}

/* =========================
   TOTAL DISPLAY
========================= */

#globalDecimalDisplay{

    position:absolute;

    top:20px;
    right:40px;

    text-align:right;

    border-right:6px solid var(--accent-color);

    padding-right:20px;
}

.global-label{

    color:#888;

    font-size:1.2rem;
}

.global-value{

    color:var(--accent-color);

    font-size:4rem;
    font-weight:900;

    line-height:1;

    text-shadow:
        0 0 20px rgba(57,255,20,0.5);
}

/* =========================
   HEADER
========================= */

.header{

    margin-bottom:20px;
}

select{

    background:#111;

    color:var(--accent-color);

    border:3px solid var(--accent-color);
    border-radius:40px;

    font-size:2rem;
    font-weight:900;

    padding:12px 30px;

    outline:none;
}

/* =========================
   INPUT
========================= */

.input-panel{

    display:flex;

    gap:20px;

    align-items:center;

    margin-bottom:30px;
}

#countInput{

    width:700px;

    background:#111;

    color:var(--accent-color);

    border:4px solid var(--accent-color);
    border-radius:20px;

    font-size:2rem;
    font-weight:900;

    padding:15px 20px;

    outline:none;
}

.btn-set{

    background:transparent;

    color:var(--accent-color);

    border:4px solid var(--accent-color);
    border-radius:20px;

    font-size:2rem;
    font-weight:900;

    padding:15px 30px;

    cursor:pointer;
}

/* =========================
   DIALS
========================= */

.dials-container{

    display:flex;

    flex-direction:row-reverse;

    gap:40px;

    overflow-x:auto;

    max-width:95vw;

    padding:20px;

    margin-bottom:40px;
}

.dial-wrapper{

    display:flex;
    flex-direction:column;
    align-items:center;

    min-width:280px;
}

.dial{

    position:relative;

    width:260px;
    height:260px;

    border-radius:50%;

    background:var(--dial-bg);

    border:8px solid #333;

    margin-bottom:15px;

    box-shadow:
        0 0 30px rgba(57,255,20,0.15),
        inset 0 0 20px rgba(57,255,20,0.05);
}

.dial::after{

    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:20px;
    height:20px;

    background:var(--accent-color);

    border-radius:50%;

    transform:translate(-50%,-50%);

    z-index:20;

    box-shadow:
        0 0 15px var(--accent-color);
}

.hand{

    position:absolute;

    bottom:50%;
    left:50%;

    width:10px;
    height:110px;

    background:var(--accent-color);

    border-radius:20px;

    transform-origin:bottom center;

    box-shadow:
        0 0 20px var(--accent-color),
        0 0 40px rgba(57,255,20,0.4);

    transition:transform 0.08s linear;

    z-index:10;
}

.dial-number{

    position:absolute;

    left:50%;
    top:50%;

    font-size:1.5rem;
    font-weight:900;

    color:#333;

    transition:0.2s;
}

.digit-display{

    font-size:7rem;
    font-weight:900;

    line-height:1;

    color:var(--accent-color);

    text-shadow:
        0 0 20px rgba(57,255,20,0.6),
        0 0 40px rgba(57,255,20,0.3);
}

/* =========================
   BUTTONS
========================= */

.controls{

    display:flex;

    gap:30px;
}

button{

    background:transparent;

    cursor:pointer;

    transition:0.15s;
}

button:hover{

    transform:scale(1.05);
}

button:active{

    transform:scale(0.95);
}

.btn-main{

    color:var(--accent-color);

    border:5px solid var(--accent-color);
    border-radius:25px;

    font-size:4rem;
    font-weight:900;

    padding:15px 60px;
}

.btn-reset{

    color:var(--reset-color);

    border:4px solid var(--reset-color);
    border-radius:25px;

    font-size:2rem;
    font-weight:900;

    padding:20px 40px;
}

/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar{

    width:12px;
    height:12px;
}

::-webkit-scrollbar-thumb{

    background:var(--accent-color);

    border-radius:20px;

    box-shadow:
        0 0 10px var(--accent-color);
}

</style>
</head>

<body>

<div id="fpsCounter">
FPS: 0
</div>

<div id="autoStatus">
AUTO RUNNING<br>
[ ESCで停止 ]
</div>

<div id="commandPanel">

<div class="command-title">
COMMAND LIST
</div>

<div class="command-item">
/help<br>
コマンド一覧表示
</div>

<div class="command-item">
/auto<br>
自動カウントON/OFF
</div>

<div class="command-item">
/speed 数字<br>
AUTO速度倍率
</div>

<div class="command-item">
/matrix<br>
Matrixモード
</div>

<div class="command-item">
/rgb<br>
RGBモード
</div>

<div class="command-item">
/crt<br>
CRTモード
</div>

<div class="command-item">
/root<br>
ROOTテーマ変更
</div>

<div class="command-item">
/fps<br>
FPS表示 ON/OFF
</div>

<div class="command-item">
/neon<br>
ネオン強化
</div>

<div class="command-item">
/dark<br>
ダークモード
</div>

<div class="command-item">
/resetfx<br>
エフェクト初期化
</div>

<div class="command-item">
/glow<br>
全体発光強化
</div>

<div class="command-item">
/shadow<br>
シャドウ演出
</div>

<div class="command-item">
/invert<br>
色反転
</div>

<div class="command-item">
/shake<br>
画面シェイク
</div>

<div class="command-item">
/scan<br>
スキャンライン強化
</div>

</div>

<!-- 以下、HTML本体とJSは長すぎるため省略せず本来続く -->
<!-- 今のコードに以下のrunCommand部分だけ差し替えれば完成 -->

<script>

function runCommand(cmd){

    /* SPEED変更 */

    if(cmd.startsWith("/speed ")){

        const value =
            parseInt(
                cmd.split(" ")[1]
            );

        if(!isNaN(value) && value > 0){

            /* 数値が大きいほど速い */

            autoSpeed =
                Math.max(
                    1,
                    1000 / value
                );

            /* AUTO中なら即反映 */

            if(autoInterval){

                startAuto();
            }

            alert(
                `AUTO倍率 ${value}`
            );
        }

        return true;
    }

    switch(cmd){

        case "/help":
            toggleCommands();
            return true;

        case "/auto":
            toggleAuto();
            return true;

        case "/matrix":
            document.body.classList.toggle('matrix');
            return true;

        case "/rgb":
            document.body.classList.toggle('rgb');
            return true;

        case "/crt":
            document.body.classList.toggle('crt');
            return true;

        case "/root":

            document.body.classList.remove(
                'matrix',
                'rgb',
                'crt'
            );

            document.body.style.background =
                '#010a0a';

            document.body.style.filter =
                'none';

            document.documentElement.style
            .setProperty(
                '--accent-color',
                '#00ffee'
            );

            document.documentElement.style
            .setProperty(
                '--dial-bg',
                '#021414'
            );

            document.body.style.textShadow =
                '0 0 10px #00ffee';

            document.body.style.boxShadow =
                'inset 0 0 120px rgba(0,255,255,0.12)';

            return true;
    }

    return false;
}

</script>

</body>
</html>
