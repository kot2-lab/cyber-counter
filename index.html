<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全部入り最終版 多進数アナログカウンタ</title>

<style>
:root{
    --bg-color:#000;
    --accent-color:#39ff14;
    --reset-color:#ff3333;
    --dial-bg:#111;
}

body{
    margin:0;
    background:var(--bg-color);
    color:white;
    font-family:'Meiryo',sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    overflow:hidden;
}

body.matrix{
    background:
        repeating-linear-gradient(
            0deg,
            #001100,
            #001100 2px,
            #000 2px,
            #000 4px
        );
}

body.rgb{
    animation:rgbbg 6s linear infinite;
}

@keyframes rgbbg{
    0%{filter:hue-rotate(0deg);}    
    100%{filter:hue-rotate(360deg);}    
}

body.crt::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(
            rgba(255,255,255,0.03) 50%,
            transparent 50%
        );
    background-size:100% 4px;
    z-index:9999;
}

#fpsCounter{
    position:absolute;
    top:20px;
    left:30px;
    color:var(--accent-color);
    font-weight:900;
    font-size:1.2rem;
}

#autoStatus{
    position:absolute;
    left:30px;
    top:60px;
    background:rgba(0,0,0,0.75);
    color:var(--accent-color);
    border:2px solid var(--accent-color);
    border-radius:20px;
    padding:15px 20px;
    font-size:1.1rem;
    font-weight:900;
    display:none;
    z-index:999;
    box-shadow:0 0 20px rgba(57,255,20,0.4);
}

#commandPanel{
    position:absolute;
    left:30px;
    top:150px;
    width:340px;
    background:rgba(0,0,0,0.82);
    border:2px solid var(--accent-color);
    border-radius:20px;
    padding:20px;
    color:var(--accent-color);
    font-weight:900;
    opacity:0;
    pointer-events:auto;
    transform:translateY(-10px);
    transition:0.25s;
    box-shadow:0 0 25px rgba(57,255,20,0.25);
    max-height:70vh;
    overflow-y:auto;
    overscroll-behavior:contain;
    backdrop-filter:blur(8px);
    z-index:999;
}

#commandPanel.show{
    opacity:1;
    transform:translateY(0);
}

#commandPanel::-webkit-scrollbar{
    width:10px;
}

#commandPanel::-webkit-scrollbar-thumb{
    background:var(--accent-color);
    border-radius:20px;
    box-shadow:0 0 10px var(--accent-color);
}

.command-title{
    font-size:1.5rem;
    margin-bottom:15px;
}

.command-item{
    margin-bottom:15px;
    line-height:1.5;
}

#globalDecimalDisplay{
    position:absolute;
    top:20px;
    right:40px;
    text-align:right;
    border-right:6px solid var(--accent-color);
    padding-right:20px;
}

.global-label{
    color:#888;
    font-size:1.2rem;
}

.global-value{
    color:var(--accent-color);
    font-size:4rem;
    font-weight:900;
    line-height:1;
    text-shadow:0 0 20px rgba(57,255,20,0.5);
}

.header{
    margin-bottom:20px;
}

select{
    background:#111;
    color:var(--accent-color);
    border:3px solid var(--accent-color);
    border-radius:40px;
    font-size:2rem;
    font-weight:900;
    padding:12px 30px;
    outline:none;
}

.input-panel{
    display:flex;
    gap:20px;
    align-items:center;
    margin-bottom:30px;
}

#countInput{
    width:700px;
    background:#111;
    color:var(--accent-color);
    border:4px solid var(--accent-color);
    border-radius:20px;
    font-size:2rem;
    font-weight:900;
    padding:15px 20px;
    outline:none;
}

.btn-set{
    background:transparent;
    color:var(--accent-color);
    border:4px solid var(--accent-color);
    border-radius:20px;
    font-size:2rem;
    font-weight:900;
    padding:15px 30px;
    cursor:pointer;
}

.dials-container{
    display:flex;
    flex-direction:row-reverse;
    gap:40px;
    overflow-x:auto;
    max-width:95vw;
    padding:20px;
    margin-bottom:40px;
}

.dial-wrapper{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:280px;
}

.dial{
    position:relative;
    width:260px;
    height:260px;
    border-radius:50%;
    background:var(--dial-bg);
    border:8px solid #333;
    margin-bottom:15px;
    box-shadow:
        0 0 30px rgba(57,255,20,0.15),
        inset 0 0 20px rgba(57,255,20,0.05);
}

.dial::after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:20px;
    height:20px;
    background:var(--accent-color);
    border-radius:50%;
    transform:translate(-50%,-50%);
    z-index:20;
    box-shadow:0 0 15px var(--accent-color);
}

.hand{
    position:absolute;
    bottom:50%;
    left:50%;
    width:10px;
    height:110px;
    background:var(--accent-color);
    border-radius:20px;
    transform-origin:bottom center;
    box-shadow:
        0 0 20px var(--accent-color),
        0 0 40px rgba(57,255,20,0.4);
    transition:transform 0.08s linear;
    z-index:10;
}

.dial-number{
    position:absolute;
    left:50%;
    top:50%;
    font-size:1.5rem;
    font-weight:900;
    color:#333;
    transition:0.2s;
}

.digit-display{
    font-size:7rem;
    font-weight:900;
    line-height:1;
    color:var(--accent-color);
    text-shadow:
        0 0 20px rgba(57,255,20,0.6),
        0 0 40px rgba(57,255,20,0.3);
}

.controls{
    display:flex;
    gap:30px;
}

button{
    background:transparent;
    cursor:pointer;
    transition:0.15s;
}

button:hover{
    transform:scale(1.05);
}

button:active{
    transform:scale(0.95);
}

.btn-main{
    color:var(--accent-color);
    border:5px solid var(--accent-color);
    border-radius:25px;
    font-size:4rem;
    font-weight:900;
    padding:15px 60px;
}

.btn-reset{
    color:var(--reset-color);
    border:4px solid var(--reset-color);
    border-radius:25px;
    font-size:2rem;
    font-weight:900;
    padding:20px 40px;
}

::-webkit-scrollbar{
    width:12px;
    height:12px;
}

::-webkit-scrollbar-thumb{
    background:var(--accent-color);
    border-radius:20px;
    box-shadow:0 0 10px var(--accent-color);
}
</style>
</head>

<body>

<div id="fpsCounter">FPS: 0</div>

<div id="autoStatus">
AUTO RUNNING<br>
[ ESCで停止 ]
</div>

<div id="commandPanel">

<div class="command-title">
COMMAND LIST
</div>

<div class="command-item">
/help<br>
コマンド一覧表示
</div>

<div class="command-item">
/auto<br>
自動カウントON/OFF
</div>

<div class="command-item">
/matrix<br>
Matrixモード
</div>

<div class="command-item">
/rgb<br>
RGBモード
</div>

<div class="command-item">
/crt<br>
CRTモード
</div>

<div class="command-item">
/root<br>
ROOTモード
</div>

</div>

<div id="globalDecimalDisplay">
<div class="global-label">
現在の合計値（10進数）
</div>
<div class="global-value" id="totalDecimal">0</div>
</div>

<div class="header">
<select id="baseSelect" onchange="syncInput(); updateDisplay();">
<option value="2">【 2進数 】</option>
<option value="3">【 3進数 】</option>
<option value="8">【 8進数 】</option>
<option value="10" selected>【 10進数 】</option>
<option value="16">【 16進数 】</option>
</select>
</div>

<div class="input-panel">
<input type="text" id="countInput" value="0">
<button class="btn-set" onclick="setCount()">反映</button>
</div>

<div class="dials-container" id="dialsContainer"></div>

<div class="controls">

<button class="btn-main"
    onmousedown="startChanging(-1)"
    onmouseup="stopChanging()"
    onmouseleave="stopChanging()">
減少
</button>

<button class="btn-reset" onclick="resetCount()">
リセット
</button>

<button class="btn-main"
    onmousedown="startChanging(1)"
    onmouseup="stopChanging()"
    onmouseleave="stopChanging()">
増加
</button>

</div>

<script>

let currentCount = 0n;
let previousDigitLength = 1;
let holdTimeout = null;
let holdSpeed = 240;
let autoInterval = null;
let autoSpeed = 100;

function playCarrySound(){

    const audioCtx =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    const notes = [523.25,659.25,783.99];

    notes.forEach((freq,index)=>{

        const oscillator =
            audioCtx.createOscillator();

        const gainNode =
            audioCtx.createGain();

        oscillator.type = "square";

        oscillator.frequency.value = freq;

        gainNode.gain.value = 0.1;

        oscillator.connect(gainNode);

        gainNode.connect(audioCtx.destination);

        const start =
            audioCtx.currentTime + index * 0.04;

        oscillator.start(start);

        oscillator.stop(start + 0.06);
    });
}

function parseBigInt(str, base){

    const chars =
        "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    str = str.toUpperCase().trim();

    let result = 0n;

    for(let i=0;i<str.length;i++){

        const digit = chars.indexOf(str[i]);

        if(digit < 0 || digit >= base){
            throw new Error("無効文字");
        }

        result =
            result * BigInt(base)
            + BigInt(digit);
    }

    return result;
}

function evaluateExpression(expr, base){

    expr = expr.replace(/[0-9A-F]+/gi, match => {

        return parseBigInt(match, base)
            .toString()
            + "n";
    });

    return Function(
        `return (${expr})`
    )();
}

function startAuto(){

    stopAuto();

    autoInterval = setInterval(()=>{

        currentCount++;

        updateDisplay();

    }, autoSpeed);

    document
    .getElementById('autoStatus')
    .style.display = 'block';
}

function stopAuto(){

    clearInterval(autoInterval);

    autoInterval = null;

    document
    .getElementById('autoStatus')
    .style.display = 'none';
}

function toggleAuto(){

    if(autoInterval){
        stopAuto();
    }else{
        startAuto();
    }
}

function toggleCommands(){

    const panel =
        document.getElementById('commandPanel');

    panel.classList.toggle('show');
}

function runCommand(cmd){

    switch(cmd){

        case "/help":
            toggleCommands();
            return true;

        case "/auto":
            toggleAuto();
            return true;

        case "/matrix":
            document.body.classList.toggle('matrix');
            return true;

        case "/rgb":
            document.body.classList.toggle('rgb');
            return true;

        case "/crt":
            document.body.classList.toggle('crt');
            return true;

        case "/root":
            document.documentElement.style
            .setProperty('--accent-color','#00ffcc');
            return true;
    }

    return false;
}

function changeCount(val){

    currentCount += BigInt(val);

    if(currentCount < 0n){
        currentCount = 0n;
    }

    syncInput();

    updateDisplay();
}

function startChanging(val){

    stopChanging();

    changeCount(val);

    holdSpeed = 240;

    function repeat(){

        changeCount(val);

        holdSpeed *= 0.94;

        if(holdSpeed < 25){
            holdSpeed = 25;
        }

        holdTimeout =
            setTimeout(repeat, holdSpeed);
    }

    holdTimeout =
        setTimeout(repeat, 500);
}

function stopChanging(){

    clearTimeout(holdTimeout);
}

function resetCount(){

    currentCount = 0n;

    syncInput();

    updateDisplay();
}

function syncInput(){

    if(autoInterval){
        return;
    }

    const base =
        parseInt(
            document.getElementById('baseSelect').value
        );

    document.getElementById('countInput').value =
        currentCount
            .toString(base)
            .toUpperCase();
}

function setCount(){

    const input =
        document.getElementById('countInput');

    const text =
        input.value.trim();

    if(runCommand(text)){
        return;
    }

    const base =
        parseInt(
            document.getElementById('baseSelect').value
        );

    try{

        currentCount =
            BigInt(
                evaluateExpression(text, base)
            );

        if(currentCount < 0n){
            currentCount = 0n;
        }

    }catch{

        currentCount = 0n;
    }

    updateDisplay();
}

function updateDisplay(){

    const base =
        parseInt(
            document.getElementById('baseSelect').value
        );

    document
    .getElementById('totalDecimal')
    .innerText =
        currentCount.toString();

    let digits = [];

    let temp = currentCount;

    if(temp === 0n){

        digits = [0];

    }else{

        const bigBase = BigInt(base);

        while(temp > 0n){

            digits.push(
                Number(temp % bigBase)
            );

            temp = temp / bigBase;
        }
    }

    if(digits.length > previousDigitLength){
        playCarrySound();
    }

    previousDigitLength = digits.length;

    renderDials(digits, base);
}

function renderDials(digits, base){

    const container =
        document.getElementById('dialsContainer');

    if(
        container.children.length !== digits.length
        ||
        container.dataset.lastBase != base
    ){

        container.innerHTML = '';

        container.dataset.lastBase = base;

        digits.forEach((_,i)=>{

            const wrapper =
                document.createElement('div');

            wrapper.className =
                'dial-wrapper';

            wrapper.innerHTML = `

                <div class="dial">

                    <div class="hand"
                         id="hand-${i}">
                    </div>

                    <div class="numbers-container"
                         id="numbers-${i}">
                    </div>

                </div>

                <div class="digit-display"
                     id="digit-${i}">
                    0
                </div>
            `;

            container.appendChild(wrapper);

            drawDialNumbers(
                document.getElementById(`numbers-${i}`),
                base
            );
        });
    }

    digits.forEach((val,i)=>{

        const hand =
            document.getElementById(`hand-${i}`);

        const digitText =
            document.getElementById(`digit-${i}`);

        const rotation =
            (val / base) * 360;

        hand.style.transform =
            `translateX(-50%) rotate(${rotation}deg)`;

        digitText.innerText =
            val.toString(base).toUpperCase();

        const labels =
            document.getElementById(`numbers-${i}`)
            .querySelectorAll('.dial-number');

        labels.forEach(label=>{

            if(
                parseInt(
                    label.dataset.value,
                    base
                ) === val
            ){

                label.style.color =
                    'var(--accent-color)';

                label.style.opacity = '1';

            }else{

                label.style.color = '#333';

                label.style.opacity = '0.3';
            }
        });
    });
}

function drawDialNumbers(container, base){

    container.innerHTML = '';

    const radius = 100;

    for(let i=0;i<base;i++){

        const div =
            document.createElement('div');

        div.className =
            'dial-number';

        div.innerText =
            i.toString(base).toUpperCase();

        div.dataset.value =
            i.toString(base).toUpperCase();

        const angle =
            (i / base) * (Math.PI * 2);

        const x =
            Math.sin(angle) * radius;

        const y =
            -Math.cos(angle) * radius;

        div.style.transform =
            `translate(${x}px, ${y}px)`;

        container.appendChild(div);
    }
}

let fps = 0;
let lastTime = performance.now();

function updateFPS(){

    const now = performance.now();

    fps = Math.round(1000 / (now - lastTime));

    lastTime = now;

    document.getElementById('fpsCounter').innerText =
        `FPS: ${fps}`;

    requestAnimationFrame(updateFPS);
}

updateFPS();

document
.getElementById('countInput')
.addEventListener('keydown', function(e){

    if(e.key === 'Enter'){
        setCount();
    }

    if(e.key === 'Escape'){
        stopAuto();
    }
});

updateDisplay();

</script>

</body>
</html>
